  - generic [ref=f3e167]:
    - generic [ref=f3e168]:
      - generic [ref=f3e169]: Built to be trusted with your clients
      - heading "Guardrails first. Sending second." [level=2] [ref=f3e170]
      - paragraph [ref=f3e171]: "Automated collections live or die on restraint. Dunwell fails closed: when it is not certain, it holds and hands you the invoice."
    - generic [ref=f3e172]:
      - generic [ref=f3e173]:
        - heading "Cited or refused" [level=3] [ref=f3e177]
        - paragraph [ref=f3e178]: A draft only contains values that exist on the invoice record. If a required fact is missing, Dunwell refuses to write instead of inventing one.
      - generic [ref=f3e179]:
        - heading "Deterministic policy engine" [level=3] [ref=f3e184]
        - paragraph [ref=f3e185]: Cooldown windows, minimum amounts, escalation age, and nudge caps are plain rules — not model guesses. Same ledger, same decisions, every time.
      - generic [ref=f3e186]:
        - heading "Escalating tone ladder" [level=3] [ref=f3e190]
        - paragraph [ref=f3e191]: Courteous reminder, firm second notice, then a final warning — with escalation to a human beyond that. Never aggressive, never improvised.
      - generic [ref=f3e192]:
        - heading "Reconciliation on payment" [level=3] [ref=f3e196]
        - paragraph [ref=f3e197]: When payment lands, the sequence stops immediately and the invoice is marked reconciled — no awkward follow-up after the check clears.
      - generic [ref=f3e198]:
        - heading "Recovery reporting" [level=3] [ref=f3e202]
        - paragraph [ref=f3e203]: Cash at risk, immediately recoverable balance, aging buckets, and days sales outstanding — the numbers you actually manage to.
      - generic [ref=f3e204]:
        - heading "Relationship memory" [level=3] [ref=f3e208]
        - paragraph [ref=f3e209]: Strategic accounts get flagged to stay warm, and every hold reason is recorded — so tone and cadence improve with each billing cycle.
