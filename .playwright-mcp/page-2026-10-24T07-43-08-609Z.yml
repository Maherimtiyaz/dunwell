  - generic [ref=f2e167]:
    - generic [ref=f2e168]:
      - generic [ref=f2e169]: Built to be trusted with your clients
      - heading "Guardrails first. Sending second." [level=2] [ref=f2e170]
      - paragraph [ref=f2e171]: "Automated collections live or die on restraint. Dunwell fails closed: when it is not certain, it holds and hands you the invoice."
    - generic [ref=f2e172]:
      - generic [ref=f2e173]:
        - heading "Cited or refused" [level=3] [ref=f2e177]
        - paragraph [ref=f2e178]: A draft only contains values that exist on the invoice record. If a required fact is missing, Dunwell refuses to write instead of inventing one.
      - generic [ref=f2e179]:
        - heading "Deterministic policy engine" [level=3] [ref=f2e184]
        - paragraph [ref=f2e185]: Cooldown windows, minimum amounts, escalation age, and nudge caps are plain rules — not model guesses. Same ledger, same decisions, every time.
      - generic [ref=f2e186]:
        - heading "Escalating tone ladder" [level=3] [ref=f2e190]
        - paragraph [ref=f2e191]: Courteous reminder, firm second notice, then a final warning — with escalation to a human beyond that. Never aggressive, never improvised.
      - generic [ref=f2e192]:
        - heading "Reconciliation on payment" [level=3] [ref=f2e196]
        - paragraph [ref=f2e197]: When payment lands, the sequence stops immediately and the invoice is marked reconciled — no awkward follow-up after the check clears.
      - generic [ref=f2e198]:
        - heading "Recovery reporting" [level=3] [ref=f2e202]
        - paragraph [ref=f2e203]: Cash at risk, immediately recoverable balance, aging buckets, and days sales outstanding — the numbers you actually manage to.
      - generic [ref=f2e204]:
        - heading "Relationship memory" [level=3] [ref=f2e208]
        - paragraph [ref=f2e209]: Strategic accounts get flagged to stay warm, and every hold reason is recorded — so tone and cadence improve with each billing cycle.
