  - generic [ref=f2e61]:
    - generic [ref=f2e62]:
      - generic [ref=f2e63]: The recurring task
      - heading "Invoicing is one of the top admin sinks founders report." [level=2] [ref=f2e64]
      - paragraph [ref=f2e65]: Across surveys of founders and small teams, administrative work is a constant drag — and invoicing and payment chasing shows up every single cycle. It is the task you do again and again, for every customer, forever.
    - generic [ref=f2e66]:
      - generic [ref=f2e67]:
        - generic [ref=f2e68]: 36%
        - heading "Of the working week spent on admin" [level=3] [ref=f2e69]
        - paragraph [ref=f2e70]: Across surveyed founders and small teams — logging expenses, research, scheduling, invoicing, and data entry eat roughly a full day every week.
      - generic [ref=f2e71]:
        - generic [ref=f2e72]: 44%
        - heading "Report invoicing as a recurring chore" [level=3] [ref=f2e73]
        - paragraph [ref=f2e74]: Invoicing and payment administration appear as one of the most common time sinks — repeated every billing cycle, for every client you serve.
      - generic [ref=f2e75]:
        - generic [ref=f2e76]: 30%
        - heading "Lost to chasing information" [level=3] [ref=f2e77]
        - paragraph [ref=f2e78]: Status hunting, repeating yourself, and context-switching are constant — the same overhead that makes payment follow-up so expensive to do manually.
  - generic [ref=f2e80]:
    - generic [ref=f2e81]:
      - generic [ref=f2e82]: How it works
      - heading "Three steps, then it runs every billing cycle." [level=2] [ref=f2e83]
      - paragraph [ref=f2e84]: Dunwell is a deterministic policy engine wrapped around a grounded drafting step. You keep approval control until you decide otherwise.
    - generic [ref=f2e85]:
      - generic [ref=f2e86]:
        - generic [ref=f2e87]: "01"
        - heading "Connect your ledger" [level=3] [ref=f2e88]
        - paragraph [ref=f2e89]: Point Dunwell at your invoices — CSV today, QuickBooks and Xero next. It reads amounts, due dates, contact details, and payment status.
      - generic [ref=f2e90]:
        - generic [ref=f2e91]: "02"
        - heading "Review the drafts" [level=3] [ref=f2e92]
        - paragraph [ref=f2e93]: Every late invoice gets an escalating draft — courteous, firm, or final. Each one is grounded in the invoice record and ready for one-click approval.
      - generic [ref=f2e94]:
        - generic [ref=f2e95]: "03"
        - heading "It reconciles and stops" [level=3] [ref=f2e96]
        - paragraph [ref=f2e97]: Payment lands? The sequence halts. Dispute, opt-out, or cooldown window? It holds and escalates to a human instead of pushing.
