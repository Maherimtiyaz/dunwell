name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No runtime dependencies to install: the engine and service are
      # standard library only. pytest comes from the dev extras.
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile every module
        run: python -m compileall -q dunwell

      - name: Run the test suite
        run: python -m pytest tests -q

  build-check:
    # Proves a clean checkout can serve the app: dashboard present, CLI runs,
    # demo ledger imports. Catches packaging mistakes tests can miss.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: CLI runs against the demo ledger
        run: |
          python -m dunwell --ledger-dir demo --as-of 2026-10-16 --out /tmp/out
          test -f /tmp/out/dunwell_report.md
          test -f /tmp/out/decisions.csv

      - name: Package data is present
        run: test -f dunwell/static/dashboard.html

      - name: Service starts and answers
        run: |
          python -m dunwell.serve --db /tmp/ci.db --port 8999 &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8999/dashboard | grep -q "Dunwell"
          # Tolerate any JSON whitespace so a serializer change cannot break CI.
          curl -fsS http://127.0.0.1:8999/api/waitlist/count \
            | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          # The health route is what a PaaS platform probes.
          curl -fsS http://127.0.0.1:8999/health \
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"up"'
          kill $SERVER_PID

      - name: Service honours the PORT environment variable
        # PaaS platforms set PORT and expect the app to bind it. A regression
        # here is a 502 in production that no other check would catch.
        run: |
          PORT=8998 python -m dunwell.serve --db /tmp/ci2.db &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8998/health | grep -q '"up"'
          kill $SERVER_PID
