name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No runtime dependencies to install: the engine and service are
      # standard library only. pytest comes from the dev extras.
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile every module
        run: python -m compileall -q dunwell

      - name: Run the test suite
        run: python -m pytest tests -q

  build-check:
    # Proves a clean checkout can serve the app: dashboard present, CLI runs,
    # demo ledger imports. Catches packaging mistakes tests can miss.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: CLI runs against the demo ledger
        run: |
          python -m dunwell --ledger-dir demo --as-of 2026-10-16 --out /tmp/out
          test -f /tmp/out/dunwell_report.md
          test -f /tmp/out/decisions.csv

      - name: Package data is present
        run: test -f dunwell/static/dashboard.html

      - name: Service starts and answers
        run: |
          python -m dunwell.serve --db /tmp/ci.db --port 8999 &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8999/dashboard | grep -q "Dunwell"
          # Tolerate any JSON whitespace so a serializer change cannot break CI.
          curl -fsS http://127.0.0.1:8999/api/waitlist/count \
            | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          # The health route is what a PaaS platform probes.
          curl -fsS http://127.0.0.1:8999/health \
            | grep -Eq '"status"[[:space:]]*:[[:space:]]*"up"'
          kill $SERVER_PID

      - name: Service honours the PORT environment variable
        # PaaS platforms set PORT and expect the app to bind it. A regression
        # here is a 502 in production that no other check would catch.
        run: |
          PORT=8998 python -m dunwell.serve --db /tmp/ci2.db &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8998/health | grep -q '"up"'
          kill $SERVER_PID

      - name: WSGI transport works (the PythonAnywhere path)
        # Production does not run `dunwell.serve`; it imports
        # `dunwell.wsgi:application`. Exercise the real socket, not just the
        # application object, or a header/body framing bug ships unseen.
        run: |
          DUNWELL_DB=/tmp/wsgi.db \
          DUNWELL_CORS_ORIGINS=https://example.github.io \
            python deploy/wsgi_smoke.py --port 8997 &
          SERVER_PID=$!
          sleep 2

          curl -fsS http://127.0.0.1:8997/health | grep -q '"up"'

          # A signup must persist through the adapter.
          curl -fsS -X POST http://127.0.0.1:8997/api/waitlist \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-wsgi@example.com"}' \
            | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          curl -fsS http://127.0.0.1:8997/api/waitlist/count \
            | grep -Eq '"count"[[:space:]]*:[[:space:]]*1'

          # The preflight that a separately hosted landing page depends on.
          status=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS \
            http://127.0.0.1:8997/api/waitlist \
            -H "Origin: https://example.github.io" \
            -H "Access-Control-Request-Method: POST")
          test "$status" = "204"

          # An origin that is not allowlisted must be refused.
          status=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS \
            http://127.0.0.1:8997/api/waitlist \
            -H "Origin: https://evil.example")
          test "$status" = "403"

          kill $SERVER_PID
